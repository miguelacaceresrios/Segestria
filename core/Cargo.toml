[package]
name = "segestria-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "io-util"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
hex = "0.4"
md-5 = "0.10"
uuid = { version = "1", features = ["v3"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
thiserror = "1"
sysinfo = "0.32"
